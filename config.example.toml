# Tactician tenant config: copy to ~/.tactician/config.toml (or $TACTICIAN_HOME/config.toml) and edit.
# One tenant folder per machine; nothing in it is ever committed to the tactician repo.

# Your name as the prompt and the judge use it ("You" in the transcript is this person).
user = "Alex"

# Folders that hold the projects you take calls about. A project is found by name under these, the menu bar lists
# their sub-folders (except names starting with "_"), and projects under one root share one stream of wrap-ups.
project_roots = ["~/work/acme"]

# The project a bare `tactician` (and the menu bar's Start <project> Call) uses.
default_project = "acme-web"

# Who is usually on the call, with roles; the menu bar passes it to every start until you edit the names.
# Roles drive the wording: plain for non-technical listeners, technical for developers.
participants = "Sam (project manager, not technical, runs the call), Pat (client, executive)"

# Chrome profile directory the board opens in ("Default", "Profile 1", ...).
browser_profile = "Default"

# The macOS shortcut that runs Muesli's "Start Meeting Recording" action with its Title set to the Shortcut Input.
shortcut = "Tactician Start Meeting"
# The shortcut that runs Muesli's "Stop Meeting Recording", run when the call app lets go of the microphone.
stop_shortcut = "Tactician Stop Meeting"
# Window titles of a call (a regex); the matching window is the one whose picture reaches the model.
# call_windows = "^Meet - |Zoom Meeting|Microsoft Teams|Huddle|Webex"
# A read-only command over your source of truth (e.g. a second brain's CLI wrapper that only allows read subcommands).
# The call session may run it mid-call for current status, deployments and who is waiting; it is never given write access.
# lookup = "~/notes/brain/read-only-cli"
# A command run when a live call that heard the room has saved its wrap-up, with the wrap-up's path as its last
# argument (e.g. a second brain's ingest). It runs detached; its output goes to logs/after-call-*.log.
# after_call = "~/notes/brain/ingest-call"

# Send on the board after a call goes to the cmux session whose folder is the lane's (general: the project root). Only a
# folder with several sessions needs an entry: lane = the workspace title to use.
# [sessions]
# acme-search = "ACME search"
